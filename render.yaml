services:
  - type: web
    name: surgescout
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MOLTBOOK_API_URL
        value: https://www.moltbook.com
      - key: MOLTBOOK_SUBMOLT
        value: lablab
      - key: SURGE_API_URL
        value: https://api.surge.xyz
      - key: PYTHON_VERSION
        value: "3.12"
